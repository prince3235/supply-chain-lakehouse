name: Supply Chain Lakehouse CI

on:
  push:
    branches: [ main, feature/*, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-validate:
    name: Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pandas numpy scikit-learn pyyaml faker plotly streamlit

      - name: Run Unit Tests & Coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/unit/ -v --junitxml=reports/junit/test-results.xml

      - name: Verify Data Generation Pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/data/test_generation.py -v

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/junit/
